[mod-setting-name]
aab-events-enabled=Log events to events.jsonl
aab-chat-prefix=Chat trigger prefix (reserved)

[mod-setting-description]
aab-events-enabled=When on, the mod appends player deaths, joins, leaves, chat, research and rocket launches to script-output/ai-agent-bridge/events.jsonl for the service to tail into history. Turn off to stop writing that file.
aab-chat-prefix=Not used yet. Reserved for a future setting that turns an ordinary chat message starting with this prefix into a question, without needing the /ask command. Leave blank.
