[mod-setting-name]
aab-events-enabled=Log events to events.jsonl
aab-chat-prefix=Chat trigger prefix
aab-answer-audience=Who reads a global answer
aab-ask-cooldown-seconds=Seconds between one player's questions
aab-asks-per-minute=Questions per minute, whole server
aab-personality=Bot personality

[mod-setting-description]
aab-events-enabled=When on, the mod appends player deaths, joins, leaves, chat, questions, answers, research and rocket launches to script-output/ai-agent-bridge/events.jsonl for the service to tail into history. Turn off to stop writing that file.
aab-chat-prefix=Leave blank and only the /ask command asks a question. Set it, and any chat line a player starts with these exact characters becomes a question, with the rest of the line as the text. Pick something no sentence starts with, ? or @ai for example. The answer goes to whoever saw the line: once a second force has players, that is the speaker's force alone.
aab-answer-audience=server prints every answer to the whole server, so anyone can follow up on it. asker prints only to the player who asked, and to nobody if they have left before the answer arrives. A private question always prints to its own audience, whatever this says: one a chat privacy mod marked private, or one asked in a chat line that reached a single force.

aab-ask-cooldown-seconds=A player who asks again sooner than this is told to wait, privately, and nothing else happens: no echo, no question, no cost. 0 turns it off.
aab-asks-per-minute=When the whole server has asked this many times in one minute, further asks are refused privately until the minute turns. Chat is shared, so this bounds the flood any number of players can cause. 0 turns it off.
aab-personality=How the bot sounds. Leave blank to use the operator's config. off turns the voice off, and factorio picks the built-in one. Anything else is a short description of how it should sound, a cheerful pirate for example, at most 500 bytes. A new value applies from the next question. Admins can also change it in game with /aab-personality.

[string-mod-setting]
aab-answer-audience-server=Whole server
aab-answer-audience-asker=Asker only
