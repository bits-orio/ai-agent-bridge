[mod-setting-name]
aab-events-enabled=Log events to events.jsonl
aab-chat-prefix=Chat trigger prefix
aab-answer-style=Where answers appear

[mod-setting-description]
aab-events-enabled=When on, the mod appends player deaths, joins, leaves, chat, questions, answers, research and rocket launches to script-output/ai-agent-bridge/events.jsonl for the service to tail into history. Turn off to stop writing that file.
aab-chat-prefix=Leave blank and only the /ask command asks a question. Set it, and any chat line a player starts with these exact characters becomes a question, with the rest of the line as the text. Pick something no sentence starts with, ? or @ai for example.
aab-answer-style=auto shows tables, comparisons and long lists in a popup window and everything else in chat. chat always prints to chat. popup always opens the window. A player who has left gets the answer in chat either way.

[string-mod-setting]
aab-answer-style-auto=Automatic
aab-answer-style-chat=Chat
aab-answer-style-popup=Popup window
